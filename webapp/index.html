<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinPay</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>💎 WinPay</h1>
        <p>Fast • Secure • Trusted</p>
    </div>

    <div class="card">

        <h2>🎉 Welcome</h2>

        <p>
            Please submit your
            <br>
            <b>Personal Invitation Code</b>
        </p>

        <input
            type="text"
            id="invite"
            placeholder="Enter Invitation Code"
        >

        <button onclick="submitCode()">
            Continue
        </button>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
